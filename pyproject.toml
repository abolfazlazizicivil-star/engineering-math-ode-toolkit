[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-math-ode-toolkit"
version = "0.1.0"
description = "Numerical methods and engineering mathematics toolkit for ODEs and engineering problems."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "sympy>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
